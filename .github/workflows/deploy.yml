# ──────────────────────────────────────────────────────────────────────────────
# Deploy workflow — BolatiPustake.in  (Vite 8 + React 19)
#
# Deploys the production build to AWS S3 and invalidates CloudFront.
# Authentication uses GitHub OIDC — NO long-lived AWS credentials are stored.
#
# ┌─ Required GitHub repository Variables ────────────────────────────────────┐
# │  (Settings → Secrets and variables → Variables)                           │
# │  AWS_REGION                  e.g.  ap-south-1                             │
# │  AWS_ACCOUNT_ID              e.g.  508375325181  ← guards wrong-account   │
# │  S3_BUCKET                   e.g.  bolatipustake-in-prod                  │
# │  CLOUDFRONT_DISTRIBUTION_ID  e.g.  EXXXXXXXXXXXX                          │
# └───────────────────────────────────────────────────────────────────────────┘
#
# ┌─ Required GitHub repository Secrets ──────────────────────────────────────┐
# │  (Settings → Secrets and variables → Secrets)                             │
# │  AWS_ROLE_ARN  e.g.  arn:aws:iam::508375325181:role/OIDC-bolatipustake.in │
# └───────────────────────────────────────────────────────────────────────────┘
#
# ┌─ IAM Trust Policy prerequisite (one-time setup) ──────────────────────────┐
# │  Principal: Federated: arn:aws:iam::<account>:oidc-provider/              │
# │                        token.actions.githubusercontent.com                 │
# │  Condition StringEquals:                                                   │
# │    token.actions.githubusercontent.com:aud  → sts.amazonaws.com            │
# │    token.actions.githubusercontent.com:sub  →                              │
# │      repo:OmkarDP/bolatipustake.in:ref:refs/heads/main                    │
# │                                                                            │
# │  ⚠ Use StringEquals (not StringLike) for maximum scope restriction.        │
# │    StringLike with wildcards allows unintended repos/branches to assume    │
# │    this role. Update the IAM trust policy if currently using StringLike.   │
# └───────────────────────────────────────────────────────────────────────────┘
# ──────────────────────────────────────────────────────────────────────────────

name: "Deploy — BolatiPustake.in"

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main                  # Production branch only
  workflow_dispatch:          # Allow manual deploys from the GitHub Actions UI

# ── Concurrency ───────────────────────────────────────────────────────────────
# One deployment per branch at a time.
# A newer push cancels any in-progress run — prevents two deploys from racing
# and leaving S3 in an inconsistent state.
concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: true

# ── Workflow-level permissions (principle of least privilege) ─────────────────
# Deny everything by default; grant only what is strictly required.
#   contents:read  — actions/checkout needs to clone the repo
#   id-token:write — configure-aws-credentials needs to mint an OIDC JWT
# All other scopes (packages, pull-requests, issues, …) are implicitly denied.
permissions:
  contents: read
  id-token: write

# ── Workflow-level environment variables ──────────────────────────────────────
env:
  BUILD_DIR:              dist    # Vite default; update if build.outDir changes
  NODE_VERSION:           "22"   # LTS. Bump intentionally when upgrading Node.
  AWS_CLI_TIMEOUT_SECONDS: "60"  # Hard cap per AWS CLI call; prevents hung jobs
  MAX_BUILD_SIZE_KB:       "15000" # Alert if bundle grows beyond this threshold

jobs:
  deploy:
    name: "Build & Deploy"
    runs-on: ubuntu-latest

    # Hard cap on total job runtime. A typical build+deploy takes ~3 minutes;
    # 15 minutes provides headroom while preventing runaway billing.
    timeout-minutes: 15

    # Linking to a named environment enables:
    #   • Environment-scoped secrets/variables
    #   • Required reviewers / protection rules
    #   • Deployment history + status on the GitHub UI
    environment:
      name: production
      url: "https://bolatipustake.in"

    steps:
      # ════════════════════════════════════════════════════════════════════════
      # PHASE 1 — PRE-FLIGHT CHECKS
      # Fail fast before spending CI minutes on avoidable mistakes.
      # ════════════════════════════════════════════════════════════════════════

      # ── Step 1: Validate all required config ─────────────────────────────────
      # Surface every missing value up front in one pass rather than letting a
      # missing variable produce a cryptic error deep in the workflow.
      # Secrets are shadowed under env vars so they never expand inline into the
      # run: script text (prevents accidental log exposure).
      - name: "Pre-flight: validate required secrets and variables"
        shell: bash
        env:
          _AWS_REGION:                 ${{ vars.AWS_REGION }}
          _AWS_ACCOUNT_ID:             ${{ vars.AWS_ACCOUNT_ID }}
          _S3_BUCKET:                  ${{ vars.S3_BUCKET }}
          _CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          _AWS_ROLE_ARN:               ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail

          MISSING=()
          [[ -z "${_AWS_REGION}"                 ]] && MISSING+=("vars.AWS_REGION")
          [[ -z "${_AWS_ACCOUNT_ID}"             ]] && MISSING+=("vars.AWS_ACCOUNT_ID")
          [[ -z "${_S3_BUCKET}"                  ]] && MISSING+=("vars.S3_BUCKET")
          [[ -z "${_CLOUDFRONT_DISTRIBUTION_ID}" ]] && MISSING+=("vars.CLOUDFRONT_DISTRIBUTION_ID")
          [[ -z "${_AWS_ROLE_ARN}"               ]] && MISSING+=("secrets.AWS_ROLE_ARN")

          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "❌ Deployment aborted — missing repository configuration:"
            for item in "${MISSING[@]}"; do
              echo "   • ${item}"
            done
            echo ""
            echo "Add these under: Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "✅ All required secrets and variables are present."

      # ── Step 2: Enforce main-only deployment ─────────────────────────────────
      # workflow_dispatch lets any branch be selected manually — this guard
      # ensures only 'main' ever reaches AWS regardless of who clicks the button.
      - name: "Pre-flight: enforce main-only deployment"
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "❌ Deployment blocked."
            echo "   This workflow only deploys from branch 'main'."
            echo "   Triggered by: ${{ github.ref_name }}"
            echo ""
            echo "   If you need to deploy from another branch, update the"
            echo "   'branches' trigger and IAM trust policy sub condition."
            exit 1
          fi

          echo "✅ Branch check passed — deploying from: ${{ github.ref_name }}"

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 2 — BUILD
      # ════════════════════════════════════════════════════════════════════════

      # ── Step 3: Checkout source ───────────────────────────────────────────────
      # Pinned to commit SHA (not just a tag) to prevent tag-moving supply-chain
      # attacks. Shallow clone (depth: 1) keeps checkout fast.
      # persist-credentials: false drops the ephemeral GitHub token from git
      # config so downstream steps cannot accidentally push.
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # ── Step 4: Set up Node.js with dependency caching ───────────────────────
      # cache: 'npm' writes ~/.npm to the Actions cache keyed on
      # package-lock.json hash — subsequent runs with the same lock file skip
      # the npm registry entirely, saving ~30–60 s on warm runs.
      - name: "Set up Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # ── Step 5: Install dependencies (reproducible) ──────────────────────────
      # `npm ci` installs exactly what package-lock.json specifies and refuses to
      # mutate it — reproducible and safe for CI environments.
      # --prefer-offline falls back to the registry only when a package is absent
      # from the local cache, shaving seconds off warm runs.
      - name: "Install dependencies"
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline

      # ── Step 6: Build production bundle ──────────────────────────────────────
      # NODE_ENV=production: some libraries (React, Framer Motion) tree-shake
      #   debug code only when this is set.
      # CI=true: suppresses interactive prompts in Vite and any other tooling.
      - name: "Build production bundle"
        shell: bash
        env:
          CI:       "true"
          NODE_ENV: "production"
        run: |
          set -euo pipefail
          npm run build

      # ── Step 7: Validate build output ────────────────────────────────────────
      # Four fast guards run before a single byte is sent to AWS:
      #   1. dist/ directory exists
      #   2. dist/ contains at least one file (not empty)
      #   3. dist/index.html exists (SPA entry point)
      #   4. Total bundle size is within the configured threshold
      - name: "Validate build output"
        shell: bash
        run: |
          set -euo pipefail

          # Guard 1: output directory must exist
          if [[ ! -d "${BUILD_DIR}" ]]; then
            echo "❌ Build directory '${BUILD_DIR}' not found."
            echo "   Verify 'build.outDir' in vite.config.js matches BUILD_DIR='${BUILD_DIR}'."
            exit 1
          fi

          # Guard 2: directory must not be empty
          FILE_COUNT=$(find "${BUILD_DIR}" -type f | wc -l)
          if [[ "${FILE_COUNT}" -eq 0 ]]; then
            echo "❌ Build directory '${BUILD_DIR}' exists but contains no files."
            exit 1
          fi

          # Guard 3: index.html must be present (SPA entry point)
          if [[ ! -f "${BUILD_DIR}/index.html" ]]; then
            echo "❌ '${BUILD_DIR}/index.html' not found — build may be misconfigured."
            exit 1
          fi

          # Guard 4: bundle size must stay within threshold
          TOTAL_KB=$(du -sk "${BUILD_DIR}" | cut -f1)
          echo "📦 Build size: ${TOTAL_KB} KB  (limit: ${MAX_BUILD_SIZE_KB} KB)"
          if [[ "${TOTAL_KB}" -gt "${MAX_BUILD_SIZE_KB}" ]]; then
            echo "❌ Bundle size ${TOTAL_KB} KB exceeds limit ${MAX_BUILD_SIZE_KB} KB."
            echo "   Run 'npm run build -- --report' to identify large dependencies."
            exit 1
          fi

          echo "✅ Build validation passed — ${FILE_COUNT} files, ${TOTAL_KB} KB"
          echo ""
          echo "Build contents:"
          ls -lhR "${BUILD_DIR}"

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 3 — AWS AUTHENTICATION
      # ════════════════════════════════════════════════════════════════════════

      # ── Step 8: Authenticate to AWS via GitHub OIDC ──────────────────────────
      # GitHub mints a short-lived OIDC JWT. This action exchanges it with AWS
      # STS (AssumeRoleWithWebIdentity) for temporary session credentials.
      #
      # Security properties:
      #   • No long-lived AWS keys stored anywhere.
      #   • Session credentials auto-expire after role-duration-seconds.
      #   • role-session-name embeds run_id + run_attempt for full CloudTrail
      #     traceability (every API call is attributed to this exact run).
      #   • role-duration-seconds: 900 matches the job timeout — credentials
      #     cannot outlive the job that created them.
      #
      # Pinned to commit SHA — aws-actions tags are mutable and can be moved.
      - name: "Configure AWS credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.1.0
        with:
          role-to-assume:        ${{ secrets.AWS_ROLE_ARN }}
          aws-region:            ${{ vars.AWS_REGION }}
          role-session-name:     "gha-deploy-${{ github.run_id }}-${{ github.run_attempt }}"
          role-duration-seconds: 900

      # ── Step 9: Verify caller identity + account guard ────────────────────────
      # This is a PERMANENT production safety check, not a debug step:
      #   1. Confirms OIDC succeeded (fast-fail before touching any resource).
      #   2. Compares the live AWS account ID against vars.AWS_ACCOUNT_ID,
      #      catching misconfigured role ARNs that would deploy to the wrong account.
      - name: "Verify AWS identity and account ID"
        shell: bash
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          IDENTITY=$(aws sts get-caller-identity \
            --output json \
            --cli-connect-timeout "${AWS_CLI_TIMEOUT_SECONDS}" \
            --cli-read-timeout    "${AWS_CLI_TIMEOUT_SECONDS}")

          ACTUAL_ACCOUNT=$(echo "${IDENTITY}" | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['Account'])")
          ACTUAL_ARN=$(echo "${IDENTITY}" | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['Arn'])")

          echo "🔐 AWS identity:"
          echo "   Account  : ${ACTUAL_ACCOUNT}"
          echo "   Role ARN : ${ACTUAL_ARN}"

          if [[ "${ACTUAL_ACCOUNT}" != "${EXPECTED_ACCOUNT_ID}" ]]; then
            echo ""
            echo "❌ ACCOUNT MISMATCH — deployment aborted."
            echo "   Expected : ${EXPECTED_ACCOUNT_ID}  (vars.AWS_ACCOUNT_ID)"
            echo "   Actual   : ${ACTUAL_ACCOUNT}"
            echo "   Cause    : Wrong IAM role ARN or wrong AWS account configured."
            exit 1
          fi

          echo "✅ AWS account verified: ${ACTUAL_ACCOUNT}"

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 4 — INFRASTRUCTURE PRE-FLIGHT
      # Verify target resources exist and are accessible before touching them.
      # ════════════════════════════════════════════════════════════════════════

      # ── Step 10: Verify S3 bucket and CloudFront distribution ─────────────────
      # Fail before uploading a single byte if target resources are missing or
      # the IAM role lacks the required read permissions.
      - name: "Pre-flight: verify S3 bucket and CloudFront distribution"
        shell: bash
        env:
          S3_BUCKET:                  ${{ vars.S3_BUCKET }}
          AWS_REGION:                 ${{ vars.AWS_REGION }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          # Verify S3 bucket exists and role has s3:ListBucket on it.
          # head-bucket returns 0 when the bucket exists and is accessible.
          echo "🔍 Checking S3 bucket: s3://${S3_BUCKET}"
          if ! aws s3api head-bucket \
                --bucket "${S3_BUCKET}" \
                --region "${AWS_REGION}" \
                --cli-connect-timeout "${AWS_CLI_TIMEOUT_SECONDS}" \
                --cli-read-timeout    "${AWS_CLI_TIMEOUT_SECONDS}" 2>&1; then
            echo "❌ S3 bucket '${S3_BUCKET}' is not accessible."
            echo "   Verify the bucket exists and the IAM role has s3:ListBucket."
            exit 1
          fi
          echo "✅ S3 bucket verified: s3://${S3_BUCKET}"

          # Verify CloudFront distribution exists and is fully propagated.
          CF_STATUS=$(aws cloudfront get-distribution \
            --id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --query "Distribution.Status" \
            --output text \
            --cli-connect-timeout "${AWS_CLI_TIMEOUT_SECONDS}" \
            --cli-read-timeout    "${AWS_CLI_TIMEOUT_SECONDS}")

          echo "🔍 CloudFront distribution status: ${CF_STATUS}"
          if [[ "${CF_STATUS}" != "Deployed" ]]; then
            echo "❌ CloudFront distribution '${CLOUDFRONT_DISTRIBUTION_ID}'"
            echo "   is not in 'Deployed' state (current: ${CF_STATUS})."
            echo "   A previous deployment may still be propagating."
            exit 1
          fi
          echo "✅ CloudFront distribution verified: ${CLOUDFRONT_DISTRIBUTION_ID}"

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 5 — DEPLOYMENT
      #
      # Atomic-ordered S3 sync: hashed assets FIRST, HTML LAST.
      #
      # Why the order matters:
      #   If a user loads the new index.html while we are still uploading assets,
      #   the browser requests the new hashed JS/CSS filenames — which must
      #   already be in S3. Uploading assets before HTML ensures this is always
      #   true. The --delete flag runs only in the second pass to avoid a brief
      #   window where valid old assets are deleted before new HTML is live.
      # ════════════════════════════════════════════════════════════════════════

      # ── Step 11: Upload hashed assets (1-year cache, immutable) ──────────────
      # Vite emits content-addressed filenames like assets/index-BcD3f9xQ.js.
      # Because the hash changes whenever content changes, these URLs are
      # effectively immutable — browsers and CDN can cache them for 1 year.
      #
      # --metadata-directive REPLACE: overwrites Cache-Control on existing objects
      #   (aws s3 sync does not update metadata by default without this flag).
      # --no-progress / --only-show-errors: reduce log noise in CI.
      - name: "Deploy: sync hashed assets → S3  (cache: 1 year, immutable)"
        shell: bash
        env:
          S3_BUCKET:  ${{ vars.S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          echo "📤 Uploading hashed assets (long-lived cache)…"
          aws s3 sync "${BUILD_DIR}" "s3://${S3_BUCKET}" \
            --region               "${AWS_REGION}" \
            --exclude              "*" \
            --include              "assets/*" \
            --cache-control        "public, max-age=31536000, immutable" \
            --metadata-directive   REPLACE \
            --no-progress \
            --only-show-errors \
            --cli-connect-timeout  "${AWS_CLI_TIMEOUT_SECONDS}" \
            --cli-read-timeout     "${AWS_CLI_TIMEOUT_SECONDS}"

          echo "✅ Hashed assets uploaded."

      # ── Step 12: Upload non-hashed files (no-cache) ───────────────────────────
      # index.html, 404.html, robots.txt, sitemap.xml, favicon.ico, etc.
      # These must NEVER be stale — browsers must always revalidate them.
      # Uploaded AFTER hashed assets (see ordering rationale above).
      #
      # --delete: removes files from S3 that no longer exist in dist/, keeping
      #   the bucket in perfect sync with the build output. Only run here (on
      #   the final pass) to avoid prematurely deleting old hashed assets.
      - name: "Deploy: sync non-hashed files → S3  (cache: no-cache)"
        shell: bash
        env:
          S3_BUCKET:  ${{ vars.S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          echo "📤 Uploading non-hashed files (no-cache)…"
          aws s3 sync "${BUILD_DIR}" "s3://${S3_BUCKET}" \
            --region               "${AWS_REGION}" \
            --exclude              "assets/*" \
            --cache-control        "no-cache, no-store, must-revalidate" \
            --metadata-directive   REPLACE \
            --delete \
            --no-progress \
            --only-show-errors \
            --cli-connect-timeout  "${AWS_CLI_TIMEOUT_SECONDS}" \
            --cli-read-timeout     "${AWS_CLI_TIMEOUT_SECONDS}"

          echo "✅ Non-hashed files uploaded."

      # ── Step 13: Invalidate CloudFront (entry points only) ────────────────────
      # Invalidate only the non-hashed HTML entry points that browsers or the
      # CDN may have cached. Hashed assets are NOT invalidated — their filenames
      # change with every build, so stale old URLs are never requested again.
      #
      # /404.html is included for SPAs: CloudFront typically serves index.html
      # for unknown routes (custom error response); some setups use 404.html.
      #
      # Cost: AWS provides 1,000 free invalidation paths/month; after that,
      # $0.005/path. Two paths per deploy ≈ $0 for most projects.
      - name: "Deploy: invalidate CloudFront (entry points only)"
        shell: bash
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id  "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths            "/index.html" "/404.html" \
            --query            "Invalidation.Id" \
            --output           text \
            --cli-connect-timeout "${AWS_CLI_TIMEOUT_SECONDS}" \
            --cli-read-timeout    "${AWS_CLI_TIMEOUT_SECONDS}")

          echo "✅ CloudFront invalidation submitted."
          echo "   Invalidation ID : ${INVALIDATION_ID}"
          echo "   Distribution    : ${CLOUDFRONT_DISTRIBUTION_ID}"
          echo "   Paths           : /index.html  /404.html"
          echo ""
          echo "ℹ️  Hashed assets (assets/*) are NOT invalidated — their filenames"
          echo "   change each build, so old stale URLs are never served."

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 6 — POST-DEPLOYMENT
      # ════════════════════════════════════════════════════════════════════════

      # ── Step 14: Write GitHub Job Summary (success) ───────────────────────────
      # Writes a formatted Markdown table to the Actions "Summary" tab.
      # Visible at: Actions → <run> → Summary.
      # Gives any team member an at-a-glance deployment receipt without
      # requiring access to the raw step logs.
      - name: "Post-deployment summary"
        if: success()
        shell: bash
        env:
          S3_BUCKET:                  ${{ vars.S3_BUCKET }}
          AWS_REGION:                 ${{ vars.AWS_REGION }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_SIZE_KB=$(du -sk "${BUILD_DIR}" | cut -f1)

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Deployment complete — BolatiPustake.in"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Commit      : ${{ github.sha }}"
          echo "  Branch      : ${{ github.ref_name }}"
          echo "  Actor       : ${{ github.actor }}"
          echo "  Run         : ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
          echo "  Deployed at : ${DEPLOY_TIME}"
          echo "  Build size  : ${BUILD_SIZE_KB} KB"
          echo "  S3 Bucket   : s3://${S3_BUCKET}  (${AWS_REGION})"
          echo "  CF Dist     : ${CLOUDFRONT_DISTRIBUTION_ID}"
          echo "  Live URL    : https://bolatipustake.in"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # GitHub Job Summary (rendered as Markdown in the Actions Summary tab)
          cat >> "${GITHUB_STEP_SUMMARY}" << SUMMARY
          ## 🚀 Deployment Complete — BolatiPustake.in

          | Field | Value |
          |---|---|
          | **Status** | ✅ Success |
          | **Commit** | \`${{ github.sha }}\` |
          | **Branch** | \`${{ github.ref_name }}\` |
          | **Actor** | \`${{ github.actor }}\` |
          | **Run** | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) (attempt ${{ github.run_attempt }}) |
          | **Deployed at** | \`${DEPLOY_TIME}\` |
          | **Build size** | \`${BUILD_SIZE_KB} KB\` |
          | **S3 Bucket** | \`s3://${S3_BUCKET}\` (${AWS_REGION}) |
          | **CloudFront** | \`${CLOUDFRONT_DISTRIBUTION_ID}\` |
          | **Live URL** | [https://bolatipustake.in](https://bolatipustake.in) |

          > **Rollback hint:** Re-run any previous successful workflow from the [Actions tab](https://github.com/${{ github.repository }}/actions) to restore the previous deployment.
          SUMMARY

      # ── Step 15: Write GitHub Job Summary (failure) ───────────────────────────
      # Runs on any failure, giving on-call engineers a direct link to the
      # failed run and a clear rollback path without digging through raw logs.
      - name: "Failure summary"
        if: failure()
        shell: bash
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" << SUMMARY
          ## ❌ Deployment Failed — BolatiPustake.in

          | Field | Value |
          |---|---|
          | **Commit** | \`${{ github.sha }}\` |
